name: CI

on:
  push:
    branches: [main, release/5.0.0rc6]
  pull_request:
    branches: [main, release/5.0.0rc6]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out OpenPine Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: 79e7f329baf3feb28459b03577e3f236bf411ee2
          path: stack/openpine-contracts

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify supported CPython and GIL
        run: |
          python - <<'PY'
          import platform
          import sys
          import sysconfig
          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.python_implementation() == "CPython"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED"), "free-threaded builds are unsupported"
          assert sys._is_gil_enabled(), "GIL must be enabled"
          PY
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/contracts-wheel"
          python -m build --wheel --outdir "$RUNNER_TEMP/contracts-wheel" ./stack/openpine-contracts
          python -m pip install "$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          python -m pip install -e ".[dev]"
          python -c "import shutil; shutil.rmtree('stack')"

      - name: Run full release gate
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          bash scripts/release_gate.sh

      - name: Run isolated wheel smoke
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          bash scripts/wheel_smoke.sh
