name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out OpenPine Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: bb1a56181e37c6f0ff7a60366d9a550103fcb8df
          path: stack/openpine-contracts

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/contracts-wheel"
          python -m build --wheel --outdir "$RUNNER_TEMP/contracts-wheel" ./stack/openpine-contracts
          python -m pip install "$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          python -m pip install -e ".[dev]"
          python -c "import shutil; shutil.rmtree('stack')"

      - name: Run full release gate
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          bash scripts/release_gate.sh

      - name: Run isolated wheel smoke
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/contracts-wheel/openpine_contracts-*.whl)"
          bash scripts/wheel_smoke.sh
