name: Verify optimizer runner and ranking integrity
'on':
  push:
    branches: ['ops/rc6-optimizer-20260906']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rc6-optimizer-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact task commits
        run: |
          cp .github/op36/restore.py "$RUNNER_TEMP/restore.py"
          python "$RUNNER_TEMP/restore.py" restore .github/op36/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install clean source and pinned broker stack
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m pip install \
            'git+https://github.com/s7cret/openpine-contracts.git@d1382d1c0a1f867cc184016d8ac670a9264a7938' \
            'git+https://github.com/s7cret/pinelib.git@cddaa0bf2324db36b4cd29e944a251032658c59d' \
            'git+https://github.com/s7cret/marketdata-provider.git@4e269bb7e3d389cae6214da9e17898c32c7ead15' \
            'git+https://github.com/s7cret/backtest_engine.git@70dd7ccfecaabafa3000d359770305acb32c8b9e' \
            "$RUNNER_TEMP/build-source[dev]"
      - name: Complete optimizer suite including real process containment
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/optimizer.xml"
      - name: Lint compile and build clean distributions
        run: |
          python -m ruff check optimizer tests/unit/test_result_integrity.py tests/unit/test_runner_input_contract.py
          python -m compileall -q optimizer
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimizer-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: optimizer-3.13-${{ github.run_id }}
          path: evidence
      - name: Publish only fully verified task commits without force
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimizer-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
