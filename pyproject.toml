[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer"
version = "4.0.2"
description = "Dependency-free parameter optimizer and runner contract layer for OpenPine strategy backtests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenClaw"}]
dependencies = [
  "openpine-contracts @ git+https://github.com/s7cret/openpine-contracts.git@af9ecbc455e9af83cdc609f6b6ff85c40fb6c8bb",
]

[project.urls]
Homepage = "https://github.com/s7cret/optimizer"
Repository = "https://github.com/s7cret/optimizer"
Issues = "https://github.com/s7cret/optimizer/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "black>=24", "mypy>=1.8", "build>=1.2"]

[project.scripts]
optimizer = "optimizer.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
optimizer = ["py.typed"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["optimizer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
include = ["optimizer", "optimizer.*"]
